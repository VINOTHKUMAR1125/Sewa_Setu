; Sewa Setu configuration (non-secret defaults).
; Secrets come from the environment: DB_PASSWORD, SECRET_KEY, ADMIN_PASSWORD
; (see .env.example). Any value here can also be overridden by an environment
; variable of the same name in upper case where documented in sewasetu/config.py.

[database]
host = db
port = 5432
name = sewasetu
user = sewasetu
pool_max = 8

[admin]
username = admin

[app]
sms_gateway_url = http://smsgw:8025
otp_validity_seconds = 300
upload_dir = /var/sewasetu/uploads
max_upload_mb = 5
session_minutes = 30

[pension]
min_age = 60
sla_days = 15
scheme_deadline = 2026-10-31 23:59
